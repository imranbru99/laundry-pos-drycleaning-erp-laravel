<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pickupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#pickupBg)" />

  <!-- Container Card -->
  <g transform="translate(60, 40)">
    <rect width="780" height="420" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Header -->
    <rect width="780" height="60" rx="20" fill="#0f172a" />
    <text x="24" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="900">
      🛵 Doorstep Pickup &amp; Delivery Wizard (/book-pickup)
    </text>
    <rect x="630" y="16" width="126" height="28" rx="8" fill="#10b981" />
    <text x="644" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">FREE DELIVERY</text>

    <!-- 3-Step Wizard Progress -->
    <g transform="translate(24, 80)">
      <!-- Step 1 (Completed) -->
      <circle cx="20" cy="20" r="16" fill="#10b981" />
      <text x="15" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">✓</text>
      <text x="44" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1. Contact &amp; Zone</text>

      <line x1="170" y1="20" x2="280" y2="20" stroke="#10b981" stroke-width="2" />

      <!-- Step 2 (Completed) -->
      <circle cx="310" cy="20" r="16" fill="#10b981" />
      <text x="305" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">✓</text>
      <text x="334" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">2. Service &amp; Clothes</text>

      <line x1="480" y1="20" x2="590" y2="20" stroke="#2563eb" stroke-width="2" />

      <!-- Step 3 (Active) -->
      <circle cx="620" cy="20" r="18" fill="#2563eb" stroke="#38bdf8" stroke-width="2" />
      <text x="616" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">3</text>
      <text x="646" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="black">3. Slot &amp; Confirm</text>
    </g>

    <!-- Form Content Preview Grid -->
    <g transform="translate(24, 140)">
      <!-- Left: Order Details summary -->
      <rect width="350" height="200" rx="12" fill="#0f172a" stroke="#334155" />
      <text x="16" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Customer Booking Summary</text>

      <text x="16" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Name:</text>
      <text x="80" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Nusrat Jahan</text>

      <text x="16" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Phone:</text>
      <text x="80" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">01822334455</text>

      <text x="16" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Address:</text>
      <text x="80" y="110" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Road 55, Gulshan-2, Dhaka</text>

      <text x="16" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Clothes:</text>
      <text x="80" y="135" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">5 items (Sharee, Blanket, Panjabi)</text>

      <text x="16" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Package:</text>
      <text x="80" y="160" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Wash &amp; Steam Iron + Dry Clean</text>

      <!-- Right: Slot Picker -->
      <g transform="translate(370, 0)">
        <rect width="360" height="200" rx="12" fill="#0f172a" stroke="#334155" />
        <text x="16" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Preferred Pickup Slot</text>

        <!-- Slot 1 Selected -->
        <rect x="16" y="48" width="328" height="38" rx="8" fill="#1e1b4b" stroke="#4338ca" />
        <circle cx="34" cy="67" r="6" fill="#38bdf8" />
        <text x="50" y="71" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">সকাল ৯:০০ - দুপুর ১২:০০ (Morning Slot)</text>

        <!-- Slot 2 -->
        <rect x="16" y="94" width="328" height="38" rx="8" fill="#1e293b" />
        <circle cx="34" cy="113" r="6" fill="#475569" />
        <text x="50" y="117" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">দুপুর ২:০০ - বিকাল ৫:০০ (Afternoon Slot)</text>

        <!-- Slot 3 -->
        <rect x="16" y="140" width="328" height="38" rx="8" fill="#1e293b" />
        <circle cx="34" cy="159" r="6" fill="#475569" />
        <text x="50" y="163" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">সন্ধ্যা ৬:০০ - রাত ৯:০০ (Evening Slot)</text>
      </g>
    </g>

    <!-- Bottom Actions -->
    <rect x="24" y="360" width="732" height="42" rx="10" fill="#2563eb" />
    <text x="280" y="386" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      🚀 রাইডার পিকআপ নিশ্চিত করুন (Schedule Rider)
    </text>
  </g>
</svg>
