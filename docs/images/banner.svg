<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Decorative circles / grid lines -->
  <circle cx="150" cy="80" r="220" fill="#38bdf8" opacity="0.08" filter="blur(40px)" />
  <circle cx="1050" cy="400" r="250" fill="#6366f1" opacity="0.12" filter="blur(50px)" />
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
  </g>

  <!-- Brand Icon Badge -->
  <rect x="80" y="60" width="64" height="64" rx="18" fill="#2563eb" filter="url(#shadow)" />
  <path d="M96 92 h32 M96 82 h32 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v-16 a4 4 0 0 1 4 -4 z M104 82 v-6 a4 4 0 0 1 4 -4 h8 a4 4 0 0 1 4 4 v6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flag and Category -->
  <rect x="160" y="74" width="230" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <circle cx="178" cy="91" r="5" fill="#10b981" />
  <text x="194" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🇧🇩 BANGLADESH LAUNDRY ERP</text>

  <!-- Title & Bengali Subtitle -->
  <text x="80" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Londi<tspan fill="#38bdf8">Shop</tspan> <tspan font-size="34" fill="#94a3b8" font-weight="600">Platform</tspan>
  </text>
  <text x="80" y="215" fill="#e2e8f0" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="22" font-weight="700">
    লন্ড্রি শপ — আধুনিক ফ্যাব্রিক কেয়ার, টাচস্ক্রিন পিওএস ও অনলাইন ডোরস্টেপ সমাধান
  </text>

  <!-- Description paragraph -->
  <text x="80" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" width="600">
    Full-featured Cloud ERP tailored for Bangladeshi garments: Panjabi, Jamdani, Katan Sharee, Suits,
  </text>
  <text x="80" y="278" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">
    and Bedding with Barcode cloth tracking, Unicode Bangla thermal invoices, and toggleable modules.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 315)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="36" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="14" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ Fast POS &amp; Tags</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="150" height="36" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="156" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🛵 Rider Dispatch</text>

    <!-- Pill 3 -->
    <rect x="304" y="0" width="145" height="36" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="318" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📄 Bangla PDF Slip</text>

    <!-- Pill 4 -->
    <rect x="461" y="0" width="140" height="36" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="475" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🤖 AI Fabric Care</text>
  </g>

  <!-- Tech Stack Badges at bottom left -->
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="90" height="28" rx="6" fill="#ef4444" />
    <text x="14" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Laravel 13</text>

    <rect x="98" y="0" width="85" height="28" rx="6" fill="#ea580c" />
    <text x="110" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Filament</text>

    <rect x="191" y="0" width="95" height="28" rx="6" fill="#0284c7" />
    <text x="204" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Tailwind v4</text>

    <rect x="294" y="0" width="105" height="28" rx="6" fill="#10b981" />
    <text x="306" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PHP 8.5 / 8.2</text>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(730, 60)" filter="url(#shadow)">
    <!-- Main Floating Screen Card -->
    <rect width="390" height="360" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Window controls -->
    <circle cx="28" cy="28" r="6" fill="#ef4444" />
    <circle cx="48" cy="28" r="6" fill="#f59e0b" />
    <circle cx="68" cy="28" r="6" fill="#10b981" />
    <text x="100" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">POS Terminal • Order #LON-8942</text>

    <!-- Mini Order Status Badge -->
    <rect x="28" y="55" width="334" height="60" rx="14" fill="#1e1b4b" stroke="#4338ca" />
    <text x="44" y="80" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STATUS: READY ON RACK</text>
    <text x="44" y="101" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Rack A-12 (Hanger #08)</text>
    <rect x="260" y="70" width="88" height="30" rx="8" fill="#10b981" />
    <text x="274" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">PAID ৳690</text>

    <!-- Sample Garment Rows -->
    <g transform="translate(28, 130)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="334" height="48" rx="10" fill="#1e293b" />
      <text x="14" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Panjabi (পাঞ্জাবি) - Dry Clean</text>
      <text x="14" y="39" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Tag: TAG-8942-01 • Defect: None</text>
      <text x="270" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">৳ 180</text>

      <!-- Row 2 -->
      <rect x="0" y="56" width="334" height="48" rx="10" fill="#1e293b" />
      <text x="14" y="80" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Jamdani Sharee (জামদানি)</text>
      <text x="14" y="95" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Tag: TAG-8942-02 • Jari care</text>
      <text x="270" y="86" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">৳ 450</text>

      <!-- Row 3 -->
      <rect x="0" y="112" width="334" height="48" rx="10" fill="#1e293b" />
      <text x="14" y="136" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Formal Pant (ফরমাল প্যান্ট)</text>
      <text x="14" y="151" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Tag: TAG-8942-03 • Wash &amp; Press</text>
      <text x="270" y="142" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">৳ 60</text>
    </g>

    <!-- Bottom Actions -->
    <rect x="28" y="305" width="160" height="36" rx="10" fill="#334155" />
    <text x="48" y="328" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🖨️ Thermal Print</text>

    <rect x="202" y="305" width="160" height="36" rx="10" fill="#2563eb" />
    <text x="228" y="328" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🛵 Dispatch &rarr;</text>
  </g>
</svg>
