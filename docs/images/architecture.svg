    <rect width="880" height="105" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="24" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">LAYER 3: SPECIALIZED PACKAGIST PACKAGE INTEGRATIONS</text>

    <g transform="translate(24, 38)">
      <!-- Package 1 -->
      <rect width="115" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="10" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">⚡ drutogoti</text>
      <text x="10" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Route Query Cache</text>

      <!-- Package 2 -->
      <rect x="122" y="0" width="115" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="132" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">📊 admin-panel</text>
      <text x="132" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Metrics &amp; Widgets</text>

      <!-- Package 3 -->
      <rect x="244" y="0" width="115" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="254" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🤖 ai-catalog</text>
      <text x="254" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Scrape Garment Rates</text>

      <!-- Package 4 -->
      <rect x="366" y="0" width="115" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="376" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🧠 ai-hub</text>
      <text x="376" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Stain &amp; Fabric Care</text>

      <!-- Package 5 -->
      <rect x="488" y="0" width="125" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="498" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">⏱️ attendance-hub</text>
      <text x="498" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Biometric Machine</text>

      <!-- Package 6 -->
      <rect x="620" y="0" width="110" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="630" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">📄 unicode-pdf</text>
      <text x="630" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Bangla Thermal PDF</text>

      <!-- Package 7 -->
      <rect x="736" y="0" width="110" height="52" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="746" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🔗 universal-slug</text>
      <text x="746" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Bangla Slugs</text>
    </g>
  </g>
</svg>
