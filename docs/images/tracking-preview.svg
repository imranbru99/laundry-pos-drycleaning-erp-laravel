<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" fill="url(#trackBg)" />

  <!-- Container Box -->
  <rect x="50" y="30" width="800" height="420" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Top bar -->
  <rect x="50" y="30" width="800" height="70" rx="20" fill="#0f172a" />
  <text x="80" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="900">
    ORDER #LON-8942
  </text>
  <rect x="300" y="52" width="100" height="28" rx="8" fill="#10b981" />
  <text x="316" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PAID (bKash)</text>

  <text x="610" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
    📍 Rack A-12 (Hanger #08)
  </text>

  <!-- Stepper 6 Steps -->
  <g transform="translate(80, 140)">
    <!-- Line -->
    <line x1="20" y1="20" x2="720" y2="20" stroke="#334155" stroke-width="4" />
    <line x1="20" y1="20" x2="580" y2="20" stroke="#2563eb" stroke-width="4" />

    <!-- Step 1 -->
    <circle cx="20" cy="20" r="18" fill="#10b981" />
    <text x="14" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="-15" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">অর্ডার গ্রহণ</text>

    <!-- Step 2 -->
    <circle cx="160" cy="20" r="18" fill="#10b981" />
    <text x="154" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="130" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ট্যাগিং সম্পন্ন</text>

    <!-- Step 3 -->
    <circle cx="300" cy="20" r="18" fill="#10b981" />
    <text x="294" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="265" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ওয়াশ ও ড্রাই ক্লিন</text>

    <!-- Step 4 -->
    <circle cx="440" cy="20" r="18" fill="#10b981" />
    <text x="434" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="415" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">স্টিম ইস্ত্রি</text>

    <!-- Step 5 (Current active) -->
    <circle cx="580" cy="20" r="22" fill="#2563eb" stroke="#38bdf8" stroke-width="3" />
    <text x="575" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">5</text>
    <text x="548" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="black">প্রস্তুত (Ready)</text>

    <!-- Step 6 -->
    <circle cx="720" cy="20" r="18" fill="#334155" />
    <text x="715" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">6</text>
    <text x="695" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ডেলিভার্ড</text>
  </g>

  <!-- Garment Table mini -->
  <g transform="translate(80, 240)">
    <rect width="740" height="170" rx="12" fill="#0f172a" />
    
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">BARCODE TAG</text>
    <text x="200" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">GARMENT</text>
    <text x="430" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SERVICE</text>
    <text x="660" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PRICE</text>

    <line x1="20" y1="44" x2="720" y2="44" stroke="#334155" />

    <!-- Row 1 -->
    <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">🏷️ TAG-8942-01</text>
    <text x="200" y="74" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">পাঞ্জাবি (Panjabi)</text>
    <text x="430" y="74" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dry Clean &amp; Polish</text>
    <text x="660" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">৳ 180</text>

    <!-- Row 2 -->
    <text x="20" y="112" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">🏷️ TAG-8942-02</text>
    <text x="200" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ঢাকাই জামদানি শাড়ি</text>
    <text x="430" y="112" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Special Drum Dry Clean</text>
    <text x="660" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">৳ 450</text>

    <!-- Row 3 -->
    <text x="20" y="150" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">🏷️ TAG-8942-03</text>
    <text x="200" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ফরমাল প্যান্ট (Pant)</text>
    <text x="430" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Wash &amp; Steam Press</text>
    <text x="660" y="150" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">৳ 60</text>
  </g>
</svg>
